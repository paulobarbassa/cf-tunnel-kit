name: 🐛 Bug Report
description: Reportar um bug ou problema
title: "[BUG] "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Obrigado por reportar um bug! Por favor, preencha as informações abaixo.

  - type: textarea
    id: description
    attributes:
      label: Descrição do Bug
      description: Uma descrição clara e concisa do bug
      placeholder: O que aconteceu?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Passos para Reproduzir
      description: Passos para reproduzir o comportamento
      placeholder: |
        1. Execute o comando '...'
        2. Configure '...'
        3. Veja o erro
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Comportamento Esperado
      description: O que você esperava que acontecesse?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Comportamento Atual
      description: O que realmente aconteceu?
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Sistema Operacional
      options:
        - Windows
        - Linux
        - macOS
        - Outro
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Versão do cf-tunnel-kit
      placeholder: ex. v1.0.0
    validations:
      required: true

  - type: input
    id: dotnet-version
    attributes:
      label: Versão do .NET
      placeholder: ex. 8.0.0
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs ou Mensagens de Erro
      description: Cole quaisquer logs ou mensagens de erro relevantes
      render: shell

  - type: textarea
    id: additional
    attributes:
      label: Contexto Adicional
      description: Adicione qualquer outro contexto sobre o problema aqui
